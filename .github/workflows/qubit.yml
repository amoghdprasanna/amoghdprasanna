name: shared-qubit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: shared-qubit
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, 'qubit:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # queued runs must start from the latest state, not the commit at issue time
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply gate
        id: qubit
        env:
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: python scripts/qubit.py

      - name: Commit
        if: steps.qubit.outputs.changed == 'true'
        env:
          OP: ${{ steps.qubit.outputs.op }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md state assets
          git commit -m "qubit: $OP by @$ACTOR"
          git push

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file msg.txt
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
